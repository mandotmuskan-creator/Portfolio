<head>
<meta charset="utf-8">

<meta name="description" content="A sticker collection by Muskan Mandot. Small drawings made for the fun of it.">
<meta name="theme-color" content="#FDFBF6">
<link rel="icon" href="assets/img/favicon.png" type="image/png">

<body data-page="stickers">
<a class="skip" href="#main">Skip to content</a>
<header data-nav></header>

<main id="main">

  <!-- ============ the title moment ============ -->
  <section class="ptitle">
    <div class="wrap ptitle__stage">
      <div class="poster ptitle__lead">
        <p class="eyebrow eyebrow--red reveal">Made for the fun of it</p>
        <h1 class="ct poster__word ptitle__word reveal" style="--d:1">
          <span class="ln">Stickers.</span>
        </h1>
      </div>

      <div class="ptitle__side reveal" style="--d:2">
        <span class="ptitle__star" aria-hidden="true"
              data-doodle="star-black" data-rot="-7"></span>
        <img class="ptitle__face" src="assets/img/face/happy.webp"
             alt="" aria-hidden="true" decoding="async" style="--face-rot:5deg">
      </div>
    </div>

    <div class="wrap">
      <p class="lede reveal" style="--d:3">
        A collection of small drawings I make when I am not designing screens.
        No brief, no stakeholders, no design system. Just things I wanted to
        exist as stickers.
      </p>
    </div>
  </section>

  <!-- ============ the collection ============ -->
  <section class="band">
    <div class="wrap">
      <ul class="stickers" id="stickers"><!-- built by stickers.js --></ul>
    </div>
  </section>

</main>

<footer data-foot></footer>
