<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo booth · Muskan Mandot</title>
<meta name="description" content="Craft, photographs, hand painted signage, hills. The things Muskan Mandot makes away from a screen.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/img/face/neutral.webp" type="image/webp">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/booth.css">
</head>

<body data-page="booth">
<a class="skip" href="#main">Skip to content</a>
<header data-nav></header>

<main id="main">

  <!-- ============ the title moment ============ -->
  <section class="ptitle booth__head">
    <div class="wrap ptitle__stage">
      <div class="poster ptitle__lead">
        <p class="eyebrow eyebrow--red">Away from the screen</p>
        <h1 class="ct poster__word ptitle__word">
          <span class="ln">Photo</span>
          <span class="ln">booth.</span>
        </h1>
      </div>

      <div class="ptitle__side">
        <span class="ptitle__star" aria-hidden="true"
              data-doodle="star-black" data-rot="9"></span>
        <img class="ptitle__face" src="assets/img/face/happy.webp"
             alt="" aria-hidden="true" fetchpriority="high" decoding="async"
             style="--face-rot:6deg">
        <p class="lede">
          Craft, gifts, hand painted signage, photographs and hills. None of
          it is work, but it all comes from the same instinct.
        </p>
      </div>
    </div>
  </section>

  <!-- ============ the rolls ============ -->
  <section class="booth" id="booth" aria-label="Photographs">
    <!-- built by booth.js -->
  </section>

  <section class="band band--tight">
    <div class="wrap">
      <blockquote class="pull reveal">
        <p>“Different materials, same instinct.”</p>
      </blockquote>
    </div>
  </section>

</main>

<footer data-foot></footer>

<script src="assets/js/crayon-ratio.js"></script>
<script src="assets/js/img-sizes.js"></script>
<script src="assets/js/crayon.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/booth.js"></script>
</body>
</html>
